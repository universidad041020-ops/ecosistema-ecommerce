server:
  port: 8082

spring:
  application:
    name: pedido-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pedidodb}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

producto-service:
  url: ${PRODUCTO_SERVICE_URL:http://localhost:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:9099/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
