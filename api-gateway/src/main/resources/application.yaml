server:
  port: 9056
spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: PRODUCTO-SERVICE
              uri: lb://PRODUCTO-SERVICE
              predicates:
                - Path=/api/productos/**
            - id: PEDIDO-SERVICE
              uri: lb://PEDIDO-SERVICE
              predicates:
                - Path=/api/pedidos/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:9099/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
